{% set name = "arviz-stats" %}
{% set version = "1.3.3" %}

package:
  name: {{ name }}-suite
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 3fed50cc2a9bb8e2719fd675691b1c332c15394e13d4b7a2bef64f6a6c2a6ccf

build:
  number: 0
  skip: true  # [py<312]

requirements:
  host:
    - python

outputs:
  - name: arviz-stats-core
    script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python
        - flit-core >=3.4,<4
        - pip
      run:
        - python
        - numpy >=2
        - scipy >=1.13
    test:
      imports:
        - arviz_stats
      commands:
        - pip check
      requires:
        - pip

  - name: arviz-stats
    script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python
        - flit-core >=3.4,<4
        - pip
      run:
        - python
        - {{ pin_subpackage('arviz-stats-core', exact=True) }}
        - arviz-base >=1.3.1,<1.4.0
        - xarray-einstats
        - xarray >=2024.11.0
    test:
      imports:
        - arviz_stats
      commands:
        - pip check
      requires:
        - pip

about:
  home: https://python.arviz.org
  summary: Statistical computation and diagnostics for ArviZ.
  description: |
    arviz-stats provides statistical computation and diagnostics for the ArviZ
    ecosystem, building on arviz-base and xarray.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://python.arviz.org/projects/stats
  dev_url: https://github.com/arviz-devs/arviz-stats

extra:
  recipe-maintainers:
    - OriolAbril
    - aloctavodia
    - tomicapretto
